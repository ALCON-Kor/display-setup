<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Setup</title>
<style>
:root { color-scheme: light dark; --fg:#1b1d21; --muted:#5b6170; --bg:#ffffff; --link:#2453b0; --rule:#e3e6ec; }
@media (prefers-color-scheme: dark) { :root { --fg:#e9ebef; --muted:#a3a9b6; --bg:#14161a; --link:#8fb0ff; --rule:#2c3038; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
h1 { font-size: 1.75rem; line-height: 1.3; margin: 0 0 .25rem; }
h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
p, ul { margin: 0 0 1rem; }
ul { padding-left: 1.25rem; }
.meta { color: var(--muted); margin-bottom: 2rem; }
a { color: var(--link); }
nav { border-bottom: 1px solid var(--rule); padding: .75rem 1.25rem; text-align: right; font-size: .95rem; }
footer { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--rule); margin-top: 3rem; padding-top: 1rem; }
</style>
</head>
<body>
<main>
<h1>Display Setup</h1>
<p class="meta">ALCON Co., Ltd.</p>
<ul>
<li><a href="ko/privacy/" hreflang="ko" lang="ko">개인정보처리방침 (한국어)</a></li>
<li><a href="en/privacy/" hreflang="en">Privacy Policy (English)</a></li>
</ul>
<footer>© 2026 ALCON Co., Ltd.</footer>
</main>
</body>
</html>
